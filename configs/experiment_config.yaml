# Values are validated by qkd_pqc.config before execution.
project:
  name: "QKD vs PQC"
  random_seed: 42

qkd:
  n_signals: 100000
  channel_error_rate: 0.01
  eve_probability: 0.0
  qber_threshold: 0.11
  channel_loss_rate: 0.0

qkd_sweep:
  repetitions: 10
  eve_probabilities: [0.0, 0.1, 0.25, 0.5, 0.75, 1.0]
  channel_error_rates: [0.0, 0.01, 0.05, 0.1, 0.2]
  channel_loss_rates: [0.0, 0.1, 0.3, 0.5, 0.8]

pqc:
  algorithm: "ML-KEM-768"
  warmup_iterations: 50
  measured_iterations: 1000

output:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  figures_dir: "figures"
